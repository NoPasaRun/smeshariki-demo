plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
base { archivesName = "raftpush" }
loom {
	splitEnvironmentSourceSets()
	mods {
		"raftpush" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}
repositories { mavenCentral() }
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "raftpush-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
def modsDir = "/home/bogdan/.minecraft/mods/"
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "com.googlecode.soundlibs:jlayer:1.0.1.4"
	for (m in ["gameplaymod", "smesharikimod", "worldmod", "behaviormod", "buildmod", "levelmod"]) implementation files(modsDir + m + "-1.0.0.jar")
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = "UTF-8" }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
